services:
  mysql:
    image: mysql:8.0
    container_name: academia-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=caching_sha2_password
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: sistema_root_dev
      MYSQL_ROOT_HOST: "%"
    volumes:
      - academia-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psistema_root_dev"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  academia-mysql-data:
