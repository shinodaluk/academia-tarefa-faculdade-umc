name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Testes unitários
        shell: pwsh
        run: ./testes.ps1

  imagem:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v5
      - name: Build da imagem Docker
        run: docker build -t academia:ci .
      - name: Sobe app + banco e testa a API
        run: |
          docker compose up -d --build
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/WebApplication1/api/planos > /dev/null; then break; fi
            sleep 3
          done
          curl -fsS http://localhost:8080/WebApplication1/api/planos
          curl -fsS http://localhost:8080/WebApplication1/api/alunos/1/avaliacao
          curl -fsS http://localhost:8080/WebApplication1/api/alunos/1/matriculas
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v
